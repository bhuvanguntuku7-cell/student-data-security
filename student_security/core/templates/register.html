<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Data Security System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 380px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: var(--text-main);
        }

        .auth-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }

        form p {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--text-main);
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.625rem 0.875rem;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .security-badges {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 500;
        }

        .badge-blue { background: #e0f2fe; color: #0369a1; }
        .badge-green { background: #f0fdf4; color: #15803d; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Student Sign Up</h2>
            <p>Create an account to access student records</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div style="padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; font-size: 0.875rem; background-color: #dcfce7; color: #166534;">
                {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Register Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login/">Log in here</a></p>
        </div>

        <div class="security-badges">
            <span class="badge badge-blue">🔒 TLS/HTTPS</span>
            <span class="badge badge-green">🛡️ RBAC Enforced</span>
        </div>
    </div>
</body>
</html>
